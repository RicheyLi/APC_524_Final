# Flame residence time per fuel model, s: how long a cell keeps flaming after the front has
# crossed it (docs/plan.md section 2.3). Read by wildfire_sim.sim (ResidenceTimeTable).
#
# EVERY VALUE BELOW IS A PLACEHOLDER. Choosing the residence times and their source is an open
# decision (docs/plan.md section 13). Candidate: Anderson (1969), t_r = 384 / sigma minutes,
# with sigma the characteristic surface-area-to-volume ratio in 1/ft.
#
# Keys of by_fuel_model are fuel model numbers as stored in Grid.fuel_model (Anderson 13 models
# 1-13, Scott & Burgan 40 models 101-204). Cells whose model is not listed use the default.
default:
  value: 60.0
  units: s
  source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
by_fuel_model:
  1:   # Anderson FM1, short grass
    value: 10.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
  2:   # Anderson FM2, timber (grass and understory)
    value: 15.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
  3:   # Anderson FM3, tall grass
    value: 15.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
  101: # Scott & Burgan GR1, short sparse dry climate grass
    value: 10.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
  102: # Scott & Burgan GR2, low load dry climate grass
    value: 10.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
  145: # Scott & Burgan SH5, high load dry climate shrub
    value: 60.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
  165: # Scott & Burgan TU5, very high load dry climate timber-shrub
    value: 180.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
  183: # Scott & Burgan TL3, moderate load conifer litter
    value: 120.0
    units: s
    source: "PLACEHOLDER - open decision in docs/plan.md section 13; candidate Anderson (1969) t_r = 384 / sigma min"
