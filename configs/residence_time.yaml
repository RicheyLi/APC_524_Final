# Flame residence time per fuel model, s: how long a cell keeps flaming after the front has
# crossed it (docs/plan.md section 2.3). Read by wildfire_sim.sim (ResidenceTimeTable).
#
# t_r = 384 / sigma minutes (Anderson 1969; Andrews 2018, RMRS-GTR-371), with sigma the
# characteristic surface-area-to-volume ratio of the fuel bed in 1/ft, computed from the fuel
# models in configs/fuel_models.csv (WP 2.1a). For a dynamic fuel model sigma depends on how
# much herbaceous load has cured, so the table is evaluated at the default moisture of
# wildfire_sim.grid.Weather (Scott & Burgan's D2L2 scenario: 1-h 6 %, 10-h 7 %, 100-h 8 %, live
# herbaceous 60 %, live woody 90 %). The Rothermel rule reports the moisture-dependent value
# itself (FuelBed.residence_time). tests/test_spread_rothermel.py checks that this file matches
# residence_times() to 0.05 s; regenerate it from that function if the fuel models change.
#
# Keys of by_fuel_model are fuel model numbers as stored in Grid.fuel_model (Anderson 13 models
# 1-13, Scott & Burgan 40 models 101-204). Cells whose model is not listed use the default.
default:
  value: 15.0
  units: s
  source: "Team choice: 15 s, near the median of the listed fuel models (6.6-20.1 s); applies only to fuel model numbers not in configs/fuel_models.csv"
by_fuel_model:
  1:   # Anderson FM1, Short grass
    value: 6.6
    units: s
    source: "Anderson (1969), Heat transfer and fire spread, USDA For. Serv. Res. Pap. INT-69: t_r = 384 / sigma min, sigma the characteristic SAV (1/ft) of the fuel bed from configs/fuel_models.csv, computed by wildfire_sim.spread.rothermel.residence_times at the Weather defaults (6/7/8 % dead, 60 % live herb, 90 % live woody)"
