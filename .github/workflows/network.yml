name: Network tests

# Weekly check that the external data services still answer as the clients expect (WP 2.6,
# docs/plan.md section 3: "a scheduled CI job runs the network tests weekly"). LANDFIRE needs an
# email address (repository secret WILDFIRE_SIM_LANDFIRE_EMAIL) and VIIRS a NASA Earthdata
# token (secret EARTHDATA_TOKEN, valid 60 days); without them those tests skip.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  network:
    name: Network tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Run the network tests
        env:
          WILDFIRE_SIM_LANDFIRE_EMAIL: ${{ secrets.WILDFIRE_SIM_LANDFIRE_EMAIL }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: uv run --python=3.12 --extra geo pytest -m network --run-network -v
