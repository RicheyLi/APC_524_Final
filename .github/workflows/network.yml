name: Network tests

# Weekly check that the external data services still answer as the clients expect (WP 2.6,
# docs/plan.md section 3: "a scheduled CI job runs the network tests weekly"). LANDFIRE needs an
# email address: add the repository secret WILDFIRE_SIM_LANDFIRE_EMAIL, or those tests skip.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  network:
    name: Network tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run the network tests
        env:
          WILDFIRE_SIM_LANDFIRE_EMAIL: ${{ secrets.WILDFIRE_SIM_LANDFIRE_EMAIL }}
        run: uv run --python=3.12 --extra geo pytest -m network --run-network -v
