[project]
site_name = "Wildfire Spread and Suppression Model"
site_url = "https://rl3936.github.io/Wildfire-Spread-and-Suppression-Model/"
repo_url = "https://github.com/rl3936/Wildfire-Spread-and-Suppression-Model"
repo_name = "rl3936/Wildfire-Spread-and-Suppression-Model"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
