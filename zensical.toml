[project]
site_name = "wildfire-sim"
site_url = "https://richeyli.github.io/APC_524_Final/"
repo_url = "https://github.com/RicheyLi/APC_524_Final"
repo_name = "RicheyLi/APC_524_Final"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Project plan" = "plan.md" },
  { "Lattice study" = "lattice_study.md" },
  { "Performance" = "performance.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
