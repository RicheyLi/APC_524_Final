[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wildfire-sim"
version = "0.1.0"
description = "Cellular-automaton wildfire spread and suppression model with strategy optimization (APC 524 final project)"
readme = "README.md"
authors = [
  {name = "Richey Li", email = "rl3936@princeton.edu"},
  {name = "Oscar Ansted", email = "oscar.ansted@princeton.edu"},
  {name = "Sunny Lin", email = "sl2308@princeton.edu"},
]
maintainers = [
  {name = "Richey Li", email = "rl3936@princeton.edu"},
  {name = "Oscar Ansted", email = "oscar.ansted@princeton.edu"},
  {name = "Sunny Lin", email = "sl2308@princeton.edu"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "imageio>=2.34",
  "typer>=0.12",
  "rich>=13",
]
requires-python = ">= 3.12"

[project.optional-dependencies]
# Compiled front-only update kernel (WP 1.7). Optional so the pure NumPy path always works.
fast = [
  "numba>=0.60",
]
# Real-world data pipeline (Phase 2). Heavy geospatial wheels; not needed for tests.
geo = [
  "rasterio>=1.4",
  "xarray>=2024.6",
  "geopandas>=1.0",
  "osmnx>=2.0",
  "py3dep>=0.17",
  "requests>=2.32",
]
# Reference Rothermel library, used only to cross-check the native implementation (WP 2.1).
rothermel = [
  "pyrothermel",
]
# Strategy search (Phase 4).
opt = [
  "optuna>=3.6",
]
all = [
  "wildfire-sim[fast,geo,rothermel,opt]",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "hypothesis>=6.170.15",
    "pytest",
    "pytest-xdist>=3.8.0",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
homepage = "https://github.com/RicheyLi/APC_524_Final"
repository = "https://github.com/RicheyLi/APC_524_Final"
bugs = "https://github.com/RicheyLi/APC_524_Final/issues"
documentation = "https://richeyli.github.io/APC_524_Final/"

[project.scripts]
wildfire-sim = "wildfire_sim.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit external data services (deselected by default; run with --run-network)",
    "slow: tests that take more than a few seconds",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_sim"]

[tool.uv]
package = true
default-groups = ["dev"]
